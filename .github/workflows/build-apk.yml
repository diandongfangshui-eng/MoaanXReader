name: Build Moaan X Lite APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract Android source
        run: tar -xzf source/moaanx-reader-src-v0.3.tar.gz
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager --install 'platforms;android-34' 'build-tools;34.0.0'
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoaanXReader-v0.3-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
