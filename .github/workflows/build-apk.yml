name: Build Moaan X Lite APK
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Decode and verify Android source
        shell: bash
        run: |
          set -euo pipefail
          cat source/part01.b64 source/part02.b64 source/part03.b64 | base64 --decode > /tmp/moaanx-source.tar.xz
          echo "6d35a4cbffbcc78d56bed3e03dea569afd797c019a731eeb5bc732a731715bee  /tmp/moaanx-source.tar.xz" | sha256sum -c -
          tar -xJf /tmp/moaanx-source.tar.xz
          test -f app/src/main/java/com/moaanx/litereader/MainActivity.java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK Platform
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-34' 'build-tools;34.0.0'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MoaanXReader-v0.3-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
